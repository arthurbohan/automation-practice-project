services:
  app:
    build:
      context: "${RABBIT_HOLE_CONTEXT:-../../rabbit hole}"
    environment:
      PORT: "3000"
      SESSION_SECRET: "local-docker-test-secret-not-for-production"

  tests:
    image: mcr.microsoft.com/playwright:v1.61.0-jammy
    working_dir: /work
    volumes:
      - "..:/work"
    environment:
      RABBIT_HOLE_BASE_URL: "http://app:3000"
      CI: "true"
    depends_on:
      - app
    command: >
      sh -c "npm ci &&
             npx wait-on http://app:3000 --timeout 60000 &&
             npx playwright test --project=rabbit-hole"
