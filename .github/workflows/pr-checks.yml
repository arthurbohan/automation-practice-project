name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── JOB 0: Lint ──────────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── JOB 1: E2E smoke ─────────────────────────────────────────────────────

  test-e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy

    permissions:
      contents: read
      pull-requests: write # for the self-healing summary PR comment below

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E smoke tests
        run: npx playwright test --project=sd-e2e --grep @smoke
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_GC: 1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Install Claude Code CLI
        if: failure()
        run: npm install -g @anthropic-ai/claude-code

      - name: AI Analysis of failures
        if: failure()
        run: npx tsx scripts/analyzeFailure.ts
        env:
          CI: true
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SKIP_MANUAL_VERDICT: true

      - name: Self-Healing Summary
        if: always()
        run: npx tsx scripts/summarizeHealing.ts

      - name: Check self-healing summary was generated
        id: healing-check
        if: always()
        run: echo "exists=$([ -f self-healing-summary.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Post self-healing summary as PR comment
        if: always() && steps.healing-check.outputs.exists == 'true'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: self-healing-summary
          path: self-healing-summary.md

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-e2e-smoke
          path: allure-results/
          retention-days: 1

      - name: Upload AI analysis summary
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-analysis-e2e-smoke
          path: ai-analysis-summary.md
          retention-days: 7

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-e2e-smoke
          path: test-results/
          retention-days: 7

  # ─── JOB 2: API smoke ─────────────────────────────────────────────────────

  test-api-smoke:
    name: API Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API smoke tests
        run: npx playwright test --project=jp-api --grep @smoke
        env:
          CI: true

      - name: Install Claude Code CLI
        if: failure()
        run: npm install -g @anthropic-ai/claude-code

      - name: AI Analysis of failures
        if: failure()
        run: npx tsx scripts/analyzeFailure.ts
        env:
          CI: true
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SKIP_MANUAL_VERDICT: true

      - name: Upload AI analysis summary
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-analysis-api-smoke
          path: ai-analysis-summary.md
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api-smoke
          path: allure-results/
          retention-days: 1

  # ─── JOB 3: AI risk analysis (PR advisory — never gates the merge) ───────────

  risk-analysis:
    name: AI Risk Analysis (PR advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI risk analysis
        run: npx tsx scripts/analyzeRisk.ts origin/${{ github.event.pull_request.base.ref }}
        env:
          CI: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true # advisory only — never fail the PR over this

      - name: Check report was generated
        id: check
        if: always()
        run: echo "exists=$([ -f ai-risk-analysis.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Post risk analysis as PR comment
        if: always() && steps.check.outputs.exists == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: ai-risk-analysis
          path: ai-risk-analysis.md

  # ─── JOB 4: Cleanup old artifacts ────────────────────────────────────────────

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [lint, test-e2e-smoke, test-api-smoke, risk-analysis]
    if: always()

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-artifacts.js')
            await cleanup({ github, context })
